<main class="calendar-page">
  <h1>Kalendarz</h1>
  <nav class="toolbar" aria-label="Nawigacja kalendarza">
    <button type="button" mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate"
            (viewDateChange)="closeOpenMonthViewDay()">Poprzedni</button>
    <button type="button" mwlCalendarToday [(viewDate)]="viewDate">Dziś</button>
    <button type="button" mwlCalendarNextView [view]="view" [(viewDate)]="viewDate"
            (viewDateChange)="closeOpenMonthViewDay()">Następny</button>
    <strong>{{ viewDate | calendarDate:(view + 'ViewTitle'):'pl' }}</strong>
    <button type="button" (click)="setView(CalendarView.Month)" [class.active]="view===CalendarView.Month">Miesiąc</button>
    <button type="button" (click)="setView(CalendarView.Week)" [class.active]="view===CalendarView.Week">Tydzień</button>
    <button type="button" (click)="setView(CalendarView.Day)" [class.active]="view===CalendarView.Day">Dzień</button>
  </nav>

  <mwl-calendar-month-view *ngIf="view === CalendarView.Month"
    [viewDate]="viewDate" [events]="events" [refresh]="refresh"
    [activeDayIsOpen]="activeDayIsOpen"
    (dayClicked)="dayClicked($event.day.date)"
    (eventTimesChanged)="eventTimesChanged($event)">
  </mwl-calendar-month-view>

  <mwl-calendar-week-view *ngIf="view === CalendarView.Week"
    [viewDate]="viewDate" [events]="events" [refresh]="refresh"
    [dayStartHour]="6" [dayEndHour]="20"
    (eventTimesChanged)="eventTimesChanged($event)">
  </mwl-calendar-week-view>

  <mwl-calendar-day-view *ngIf="view === CalendarView.Day"
    [viewDate]="viewDate" [events]="events" [refresh]="refresh"
    [dayStartHour]="6" [dayEndHour]="20"
    (eventTimesChanged)="eventTimesChanged($event)">
  </mwl-calendar-day-view>

  <section class="events-editor">
    <h2>Wydarzenia</h2>
    <button type="button" (click)="addEvent()">Dodaj wydarzenie</button>
    <p *ngIf="events.length===0">Brak wydarzeń.</p>
    <div *ngFor="let event of events" class="event-row">
      <input type="text" [(ngModel)]="event.title" (ngModelChange)="refresh.next()" aria-label="Tytuł wydarzenia">
      <input type="datetime-local" [value]="toLocalDateTime(event.start)" (change)="updateStart(event,$event)" aria-label="Początek wydarzenia">
      <button type="button" (click)="removeEvent(event)">Usuń</button>
    </div>
  </section>
</main>
